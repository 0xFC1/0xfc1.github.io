<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="origin">
  <title>Подключение домашнего интернета — dom.ru</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #2d3436;
      --muted: #8492a6;
      --accent: #e83a3a;
      --accent-hover: #c83535;
      --border: #dfe6e9;
    }
    * { box-sizing: borderbox; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--bg); color: var(--text); line-height: 1.6; }
    
    /* Header */
    .header {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 12px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    .nav {
      display: flex;
      gap: 12px;
    }
    .nav-btn, .nav-link {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: 1px solid var(--border);
      outline-offset: 2px;
    }
    .nav-btn:hover, .nav-link:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      outline: 1px solid var(--accent);
    }
    .nav-btn:focus, .nav-link:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    
    /* Auth form styles */
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card {
      background: var(--card);
      width: 100%;
      max-width: 400px;
      padding: 40px 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
    }
    .auth-card h2 {
      margin-bottom: 24px;
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
    }
    .auth-card p {
      margin-bottom: 24px;
      color: var(--text);
      font-size: 14px;
    }
    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group label {
      
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }
    .input-group i{
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
    }
    .input-group input {
      
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      
      
      background: #fff;
      transition: border-color 0.2s;
    }
    .input-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(232, 58, 58, 0.15);
    }
    .btn {
      width: 100%;
      padding: 10px 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:focus { outline: 2px solid var(--accent-hover); outline-offset: 2px; }
    .close {
      float: right;
      font-size: 20px;
      color: var(--text);
      cursor: pointer;
      line-height: 1;
    }
    .close:hover { color: var(--text); }
    
    /* Success state */
    .success { padding: 40px 20px; text-align: center; }
    .success i { font-size: 48px; color: var(--accent); margin-bottom: 16px; display: block; }
    .success h3 { font-size: 20px; margin-bottom: 8px; }
    .success p { color: var(--text); }
    
    /* Modal overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    
    /* Stat popup */
    .stat-popup {
      position: fixed;
      top: 80px;
      right: 20px;
      z-index: 1001;
      background: var(--card);
      padding: 20px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      width: 200px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .stat-popup h3 {
      margin-bottom: 12px;
      font-size: 14px;
      color: var(--accent);
      text-align: center;
    }
    .stat-popup p {
      margin: 6px 0;
      font-size: 12px;
      color: var(--text);
      display: flex;
      justify-content: space-between;
    }
    .stat-popup p span {
      color: var(--text);
      font-weight: 500;
    }
    .stat-popup .divider {
      height: 1px;
      background: var(--border);
      margin: 12px 0;
    }
    .stat-popup .btn {
      width: 100%;
      margin-top: 8px;
      font-size: 12px;
      padding: 6px 12px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  
  

  <div class="auth-page">
    <div class="auth-card">
      <h2>Подключение домашнего интернета</h2>
      <form id="contractForm">
        <div class="input-group">
          <label for="homeAddress">Домашний адрес</label>
          <input type="text" id="homeAddress" placeholder="ул. Красная, 1" required>
        </div>
        <div class="input-group">
          <label for="floor">Этаж</label>
          <input type="number" id="floor" placeholder="1" min="1" max="50" required>
        </div>
        <div class="input-group">
          <label for="apartment">Номер квартиры</label>
          <input type="number" id="apartment" placeholder="123" min="1" max="999" required>
        </div>
        
        <div class="input-group">
          
            <input type="checkbox" id="routerCheckbox" name="buyrouter" checked>
            <label for="buyrouter">
            Приобрести роутер wave
          </label>
        </div>
        
        <div id="guestAccessContainer">
          <div class="input-group">
            
              <input type="checkbox" id="guestWifiCheckbox" name="allowguest">
              <label for="allowguest"> Разрешить использовать wifi как гостевой </label><br>
              <i>Разрешенный гостевой доступ позволяет получить скидку по абонентской плате, зависящей от объема использованного гостями трафика</i>
            
          </div>
        </div>
        
        <button type="submit" class="btn" name="submitBtn">Отправить заявку</button>
      </form>
    </div>
  </div>

  <script>
    // Toggle guest access checkbox when router checkbox changes
    const routerCheckbox = document.getElementById('routerCheckbox');
    const guestAccessContainer = document.getElementById('guestAccessContainer');
    
    routerCheckbox.addEventListener('change', function() {
      if (this.checked) {
        guestAccessContainer.style.display = 'block';
      } else {
        guestAccessContainer.style.display = 'none';
        guestAccessContainer.querySelector('input').checked = false;
      }
    });

    // Form submission
    document.getElementById('contractForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Show success message
      const form = this;
      const successDiv = document.createElement('div');
      successDiv.className = 'success';
      successDiv.innerHTML = `
        <i class="fa fa-check-circle" aria-hidden="true"></i>
        <h3>Заявка отправлена!</h3>
        <p>Спасибо за интерес к подключению домашнего интернета. Мы свяжемся с вами в ближайшее время.</p>
      `;
      form.parentElement.appendChild(successDiv);
      
      
    });

    
    
  </script>
</body>
</html>
